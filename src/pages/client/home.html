<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store</title>
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="../../styles/client/client.css">
</head>
<body>
    <header class="header">
        <h1 class="header__logo">🍕 Food Store</h1>
            <nav class="header__nav">
                <ul class="header__ul">
                    <li class="header__li"><a href="../../pages/client/home.html" class="active">Inicio</a></li>
                    <li class="header__li"><a href="../../pages/client/orders.html">Mis Pedidos</a></li>
                    <li class="header__li"><a href="../../pages/client/cart.html">Carrito</a></li>
                    <li class="header__li" id="logoutButton"><a href="../../pages/auth/login/login.html">Cerrar Sesión</a></li>
                    <li class="header__li" id="adminPanel" style="display: none;">
                        <a href="../../pages/admin/admin.html">Panel Admin</a>
                    </li>
                </ul>
            </nav>
    </header>
    <hr>
    <div class="layout-container">
        <aside class="aside">
            <h2 class="aside__title">Categorias</h2>
            <ul class="aside__ul" id="lista-categorias"></ul>
        </aside>
        <div class="client-container">
            <main class="main">
            <form class="main__form">
                <label class="main__label" for="buscarProductos">Buscar productos</label>
                <input class="main__input" 
                    id="buscarProductos" 
                    type="text" 
                    placeholder="Buscar por nombre o descripción..."
                    autocomplete="off">
                
                <select id="btn-ordenar" class="main__select">
                    <option value="default">Ordenar por...</option>
                </select>
                
                <button class="main__button" type="submit">🔍 Buscar</button>
            </form>

            <h2 class="main__title">Nuestros Productos</h2>
            
            <section class="main__section" id="contenedor-productos">
                <p>Cargando productos...</p>
            </section>
        </main> 
        </div>
    </div>      
    <footer class="footer">
        <p class="footer__p">&copy; 2026 Food Store. Todos los derechos reservados.</p>
        <p class="footer__p">Contacto: <a href="mailto:info@foodstore.com">info@foodstore.com</a></p>
    </footer>
    <script type="module" src="../../store/home/home.ts"></script>
</body>
</html>

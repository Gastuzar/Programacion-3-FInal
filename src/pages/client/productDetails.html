<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store</title>
    <link rel="stylesheet" href="../../styles/style.css">
    <link rel="stylesheet" href="../../styles/client/store/productDetail.css">
</head>
<body>
    <header class="header">
        <h1 class="header__logo">🍕 Food Store</h1>
            <nav class="header__nav">
                <ul class="header__ul">
                    <li class="header__li"><a href="../../pages/client/home.html">Inicio</a></li>
                    <li class="header__li"><a href="../../pages/client/orders.html">Mis Pedidos</a></li>
                    <li class="header__li"><a href="../../pages/client/cart.html">Carrito</a></li>
                    <li class="header__li" id="logoutButton"><a href="../../pages/auth/login/login.html">Cerrar Sesión</a></li>
                    <!-- Solo se debe ver si sos admin -->
                    <li class="header__li" id="adminPanel" style="display: none;">
                        <a href="../../pages/admin/admin.html">Panel Admin</a>
                    </li>
                </ul>
            </nav>
    </header>
    <!-- ... header ... -->
        <main class="details-container">
            <div class="product-detail">
                <!-- Lado Izquierdo: Imagen -->
                <div class="product-detail__image-container">
                    <img id="detail-image" src="" alt="" class="product-detail__img">
                </div>

                <!-- Lado Derecho: Información -->
                <div class="product-detail__info">
                    <p id="detail-category" class="product-detail__category"></p>
                    <h2 id="detail-name" class="product-detail__title"></h2>
                    <p id="detail-price" class="product-detail__price"></p>
                    
                    <div id="detail-status" class="product-detail__status">
                        <!-- Se llena dinámicamente: Disponible (Stock: X) -->
                    </div>

                    <p id="detail-description" class="product-detail__description"></p>

                    <div class="product-detail__purchase">
                        <label for="quantity">Cantidad:</label>
                        <div class="quantity-selector">
                            <button type="button" id="btn-minus" class="quantity-btn">-</button>
                            <input type="number" id="quantity" value="1" min="1" readonly>
                            <button type="button" id="btn-plus" class="quantity-btn">+</button>
                        </div>
                    </div>

                    <div class="product-detail__actions">
                        <button id="btn-add-cart" class="button button--primary">
                            🛒 Agregar al Carrito
                        </button>
                        <button id="btn-back" class="button button--secondary">
                            ← Volver
                        </button>
                    </div>
                </div>
            </div>
        </main>
<!-- ... footer ... -->
    <footer class="footer">
        <p class="footer__p">&copy; 2026 Food Store. Todos los derechos reservados.</p>
        <p class="footer__p">Contacto: <a href="mailto:info@foodstore.com">info@foodstore.com</a></p>
    </footer>
    <script type="module" src="../../store/productDetail/productDetails.ts"></script>
</body>
</html>
